services:
  cats-dogs-api:
    image: ${IMAGE:-cats-dogs-api:local}
    build: .
    container_name: cats-dogs-api
    ports:
      - "8000:8000"
    environment:
      APP_VERSION: ${APP_VERSION:-1.0.0}
      LOG_DIR: /app/logs
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
